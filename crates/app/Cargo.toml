[package]
name = "resourcewatch-app"
version = "0.1.0"
description = "ResourceWatch Linux desktop resource monitor (Rust + Slint)"
license = "MIT"
edition = "2021"
rust-version = "1.85"

# shortcut: binary is `resourcewatch-slint` while the Tauri app (also
# `resourcewatch`) shares the workspace target/; Phase 7 renames it to `resourcewatch`.
[[bin]]
name = "resourcewatch-slint"
path = "src/main.rs"

[dependencies]
resourcewatch-core = { path = "../core" }
# Pinned: the `unstable-winit-030` API may change in minor releases.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "unstable-winit-030"] }
raw-window-handle = "0.6"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[build-dependencies]
slint-build = "=1.18.1"
