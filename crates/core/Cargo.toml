[package]
name = "resourcewatch-core"
version = "0.1.0"
description = "ResourceWatch data collection, scheduling and settings (UI-independent)"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "resourcewatch_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NVML is loaded at runtime (no link-time NVIDIA dependency).
libloading = "0.8"
# getifaddrs() for IPv4 lookup without spawning `ip`.
libc = "0.2"
