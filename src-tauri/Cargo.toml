[package]
name = "resourcewatch"
version = "0.3.5"
description = "ResourceWatch Linux desktop resource monitor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
libloading = "0.8"
tauri-plugin-dialog = "2"
gtk = "0.18" # same version tauri uses; hosts the inspector window
webkit2gtk = "2.0" # same crate wry uses; inspector settings it does not expose
