[package]
name = "resourcewatch"
version = "0.1.0"
description = "ResourceWatch Linux desktop resource monitor (Rust + Tauri 2)"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "resourcewatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NVML is loaded at runtime (no link-time NVIDIA dependency).
libloading = "0.8"
# getifaddrs() for IPv4 lookup without spawning `ip`.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdkwayland-sys = "0.18"
gtk = "0.18"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
