[package]
name = "resourcewatch"
version = "1.0.0"
description = "ResourceWatch Linux desktop resource monitor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
libloading = "0.8"
