[workspace]
members = ["crates/core", "crates/app", "src-tauri"]
# spikes/* are standalone crates with their own empty [workspace].
exclude = ["spikes"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# softbuffer 0.4 hardcodes wl_shm Xrgb8888 on Wayland, which drops alpha and makes
# the software-rendered Slint window opaque (no visible blur). Patched copy uses
# Argb8888; spikes/slint-poc points at the same copy.
[patch.crates-io]
softbuffer = { path = "patches/softbuffer" }
