[package]
name = "slint-poc"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: Phase 0 spike, not part of any workspace.
[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg", "renderer-software", "unstable-winit-030"] }
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

png = "0.17"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# softbuffer 0.4 hardcodes wl_shm Xrgb8888 on Wayland, which drops alpha and makes
# the software-rendered window opaque (no visible blur). Patched copy uses Argb8888.
[patch.crates-io]
softbuffer = { path = "patches/softbuffer" }
