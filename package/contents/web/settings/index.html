<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ResourceWatch — 設定</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./settings.js" defer></script>
</head>
<body>
  <main class="settings-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">RESOURCE WATCH</p>
        <h1>小工具設定</h1>
        <p class="subtitle">調整資料更新和監控裝置</p>
      </div>
      <span class="connection-state" id="connectionState" role="status">預覽模式</span>
    </header>

    <section class="settings-card" aria-labelledby="refreshHeading">
      <h2 id="refreshHeading">監控更新排程</h2>
      <p class="settings-explainer">所有即時監控、歷史圖表和 HTML 畫面共用一組更新間隔。預設 500 ms，範圍 100–10000 ms、步進 50 ms；實際感測器更新率仍受 KDE 與驅動限制。</p>
      <div class="field-grid">
        <label class="field" for="updateInterval">
          <span class="field-label">統一更新間隔</span>
          <span class="field-hint">CPU、GPU、VRAM、RAM、磁碟、網路、歷史圖表及 HTML 畫面共用</span>
          <div class="input-unit"><input id="updateInterval" type="number" min="100" max="10000" step="50" value="500" required><span>ms</span></div>
        </label>
        <label class="field" for="historyPoints">
          <span class="field-label">歷史資料點數</span>
          <span class="field-hint">每張圖最多保留的紀錄數量</span>
          <div class="input-unit"><input id="historyPoints" type="number" min="10" max="120" step="10" value="30" required><span>點</span></div>
        </label>
      </div>
    </section>

    <section class="settings-card" aria-labelledby="devicesHeading">
      <h2 id="devicesHeading">裝置與手動刷新</h2>
      <div class="field-grid">
        <label class="field" for="gpuIndex">
          <span class="field-label">GPU 編號</span>
          <span class="field-hint">多張顯卡可從 0 開始指定</span>
          <input id="gpuIndex" type="number" min="0" max="15" step="1" value="0" required>
        </label>
        <label class="field" for="netInterface">
          <span class="field-label">網路介面</span>
          <span class="field-hint">all 為所有介面，可指定如 enp3s0</span>
          <input id="netInterface" type="text" maxlength="64" value="all" spellcheck="false" autocomplete="off">
        </label>
      </div>
      <div class="refresh-actions">
        <div class="refresh-action"><div><strong>IPv4 位址</strong><p>立即重新查詢目前選取的介面（已套用的設定）</p></div><button type="button" id="refreshIPv4">重新讀取 IPv4</button></div>
        <div class="refresh-action"><div><strong>實體硬碟清單</strong><p>立即重新偵測 SATA／SAS／NVMe／IDE</p></div><button type="button" id="refreshDisks">重新掃描硬碟</button></div>
        <p class="refresh-feedback" id="refreshFeedback" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="page-footer">
      <p>更新間隔與裝置設定在「套用／確定」後儲存；重新讀取按鈕是立即動作，不需要按「套用」。</p>
      <p class="preview-note" id="previewNote">在瀏覽器開啟時僅供設計預覽，不會寫入 KDE 設定。</p>
    </footer>
  </main>
</body>
</html>
